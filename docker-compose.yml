services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/ev.db
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-this-64-character-secret-before-production-000000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,api}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-evminio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-replace-minio-password}
    volumes:
      - api_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - minio

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-evminio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-replace-minio-password}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ev}
      POSTGRES_USER: ${POSTGRES_USER:-ev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-postgres-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  api_data:
  minio_data:
  postgres_data:
