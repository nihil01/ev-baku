services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:80"
    depends_on:
      - api

  api:
    build: ./backend
    restart: unless-stopped

    environment:
      CORS_ALLOW_ALL: ${CORS_ALLOW_ALL:-false}
      APP_NAME: ${APP_NAME:-ev. Baku API}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      DATABASE_URL: sqlite+aiosqlite:////app/data/ev.db
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in the production environment}

      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,api}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-ev_session}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-ev_csrf}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-14}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-null}

      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_DEFAULT_REQUESTS: ${RATE_LIMIT_DEFAULT_REQUESTS:-180}
      RATE_LIMIT_DEFAULT_WINDOW_SECONDS: ${RATE_LIMIT_DEFAULT_WINDOW_SECONDS:-60}
      RATE_LIMIT_AUTH_REQUESTS: ${RATE_LIMIT_AUTH_REQUESTS:-10}
      RATE_LIMIT_AUTH_WINDOW_SECONDS: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:-300}
      RATE_LIMIT_LOGIN_ACCOUNT_REQUESTS: ${RATE_LIMIT_LOGIN_ACCOUNT_REQUESTS:-8}
      RATE_LIMIT_LOGIN_ACCOUNT_WINDOW_SECONDS: ${RATE_LIMIT_LOGIN_ACCOUNT_WINDOW_SECONDS:-900}
      RATE_LIMIT_REGISTER_REQUESTS: ${RATE_LIMIT_REGISTER_REQUESTS:-5}
      RATE_LIMIT_REGISTER_WINDOW_SECONDS: ${RATE_LIMIT_REGISTER_WINDOW_SECONDS:-3600}
      RATE_LIMIT_WRITE_REQUESTS: ${RATE_LIMIT_WRITE_REQUESTS:-60}
      RATE_LIMIT_WRITE_WINDOW_SECONDS: ${RATE_LIMIT_WRITE_WINDOW_SECONDS:-60}
      RATE_LIMIT_EXPENSIVE_REQUESTS: ${RATE_LIMIT_EXPENSIVE_REQUESTS:-30}
      RATE_LIMIT_EXPENSIVE_WINDOW_SECONDS: ${RATE_LIMIT_EXPENSIVE_WINDOW_SECONDS:-60}

      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/data/uploads}
      LANDING_VIDEO_PATH: ${LANDING_VIDEO_PATH:-/app/landing-videos}
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-15}
      MAX_VIDEO_MB: ${MAX_VIDEO_MB:-100}

      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      GEOAPIFY_RADIUS_METERS: ${GEOAPIFY_RADIUS_METERS:-1000}
      EXCHANGE_RATE_API_KEY: ${EXCHANGE_RATE_API_KEY:-}
      EXCHANGE_RATE_PROVIDER: ${EXCHANGE_RATE_PROVIDER:-exchangerate-api}
      EXCHANGE_RATE_BASE_URL: ${EXCHANGE_RATE_BASE_URL:-}
      EXCHANGE_RATE_CACHE_SECONDS: ${EXCHANGE_RATE_CACHE_SECONDS:-21600}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-20}
      GUEST_AI_REQUEST_LIMIT: ${GUEST_AI_REQUEST_LIMIT:-5}
      MAX_VOICE_MB: ${MAX_VOICE_MB:-10}

      # Название minio пока оставляем, потому что backend
      # использует Python Minio SDK как S3-клиент.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}

      MINIO_ENDPOINT: garage:3900
      MINIO_PUBLIC_ENDPOINT: garage:3900

      MINIO_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      MINIO_SECRET_KEY: ${GARAGE_SECRET_KEY}
      MINIO_BUCKET: ev-media

      MINIO_REGION: garage
      MINIO_SECURE: "false"
      MINIO_PUBLIC_SECURE: "false"

    volumes:
      - api_data:/app/data

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      - garage

  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped

    command:
      - /garage
      - server
      - --single-node
      - --default-bucket

    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN}

      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ev-media

      RUST_LOG: garage=info

    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

    ports:
      # Для диагностики доступен только с самого сервера.
      - "127.0.0.1:9000:3900"

  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ev}
      POSTGRES_USER: ${POSTGRES_USER:-ev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-postgres-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  api_data:
  garage_meta:
  garage_data:
  postgres_data:
